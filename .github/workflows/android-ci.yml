name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - uses: gradle/actions/setup-gradle@v4
      - name: Make Wrapper executable
        run: chmod +x gradlew
      - name: Unit tests (includes core time tests)
        shell: bash
        run: ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee "$RUNNER_TEMP/unit.log"
      - name: Android lint
        if: ${{ !cancelled() }}
        run: ./gradlew lintDebug --stacktrace
      - name: Assemble debug APK
        if: ${{ !cancelled() }}
        run: ./gradlew assembleDebug --stacktrace
      - name: Verify committed Room schemas
        run: |
          git diff --exit-code -- app/schemas
          test -z "$(git ls-files --others --exclude-standard app/schemas)"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: floating-clock-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-check-reports
          path: |
            app/build/reports/
            core/time/build/reports/tests/
            core/time/build/test-results/
          if-no-files-found: warn
      - name: Publish unit test counts and failures
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          import os
          log = pathlib.Path(os.environ["RUNNER_TEMP"]) / "unit.log"
          if log.exists():
              for line in log.read_text().splitlines():
                  if line.startswith("e: "):
                      print("::error::" + line.replace("%", "%25"))
          for directory in ("app/build/test-results", "core/time/build/test-results"):
              counts = dict(tests=0, failures=0, errors=0, skipped=0)
              for path in pathlib.Path(directory).rglob("TEST-*.xml"):
                  root = ET.parse(path).getroot()
                  for key in counts:
                      counts[key] += int(root.get(key, 0))
                  for case in root.iter("testcase"):
                      for failure in list(case.findall("failure")) + list(case.findall("error")):
                          message = (failure.text or failure.get("message", ""))[:5000]
                          message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                          print(f"::error title={case.get('name')}::{message}")
              print(f"::notice title=Unit test results::{directory}: {counts}")
          PY

  overlay-smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        api: [31, 33, 35]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: chmod +x gradlew
      - name: Overlay smoke test (emulator only)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash .github/scripts/emulator-checks.sh
      - name: Upload homepage light and dark screenshots
        if: matrix.api == 35 && success()
        uses: actions/upload-artifact@v4
        with:
          name: home-api35-screenshots
          path: app/build/outputs/home-screenshots/
          if-no-files-found: error
      - name: Publish emulator test counts and failures
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          counts = dict(tests=0, failures=0, errors=0, skipped=0)
          for path in pathlib.Path("app/build/outputs/androidTest-results").rglob("TEST-*.xml"):
              root = ET.parse(path).getroot()
              for key in counts:
                  counts[key] += int(root.get(key, 0))
              for case in root.iter("testcase"):
                  for failure in list(case.findall("failure")) + list(case.findall("error")):
                      message = (failure.text or failure.get("message", ""))[:5000]
                      message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                      print(f"::error title={case.get('name')}::{message}")
          print(f"::notice title=Emulator test results::{counts}")
          PY
      - name: Upload emulator reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-${{ matrix.api }}-smoke-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
